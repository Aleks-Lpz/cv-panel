<div class="dashboard-container">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>Admin CV</h2>
    <button *ngFor="let col of colecciones" 
            (click)="cambiarColeccion(col)" 
            [class.active]="colActual === col"
            class="nav-btn">
      {{ col | titlecase }}
    </button>
  </aside>

  <!-- Contenido Principal -->
  <main class="content">
    <div class="card">
      <h3>Gestionar {{ colActual | titlecase }}</h3>
      
      <form (ngSubmit)="guardar()" #crudForm="ngForm">
        <div class="form-grid">
          <!-- Generación dinámica de inputs basada en tus campos de Firestore -->
          <ng-container [ngSwitch]="colActual">
            
            <!-- Skills -->
            <div *ngSwitchCase="'skills'">
              <input [(ngModel)]="formData.name" name="name" placeholder="Nombre de Skill" required>
              <input type="number" [(ngModel)]="formData.percentage" name="percentage" placeholder="Porcentaje (0-100)">
            </div>

            <!-- Work Experience -->
            <div *ngSwitchCase="'work-experience'">
              <input [(ngModel)]="formData.position" name="position" placeholder="Puesto">
              <input [(ngModel)]="formData.company" name="company" placeholder="Empresa">
              <textarea [(ngModel)]="formData.accomplishments" name="accomplishments" placeholder="Logros"></textarea>
            </div>

            <!-- Header (Caso especial de un solo registro) -->
            <div *ngSwitchCase="'header'">
              <input [(ngModel)]="formData.name" name="name" placeholder="Nombre">
              <input [(ngModel)]="formData.goalLife" name="goalLife" placeholder="Objetivo">
            </div>

            <!-- Default: Para intereses, certificados, etc. -->
            <div *ngSwitchDefault>
              <input [(ngModel)]="formData.title" name="title" placeholder="Título">
              <input [(ngModel)]="formData.description" name="description" placeholder="Descripción">
            </div>
          </ng-container>
        </div>

        <button type="submit" class="btn-save">{{ isEditing ? 'Actualizar' : 'Añadir' }}</button>
        <button type="button" (click)="resetForm()" *ngIf="isEditing">Cancelar</button>
      </form>

      <!-- Tabla de resultados -->
      <table>
        <thead>
          <tr>
            <th>Info</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of items">
            <td>
              <strong>{{ item.title || item.name || item.position }}</strong><br>
              <small>{{ item.year || item.company }}</small>
            </td>
            <td>
              <button (click)="editar(item)">✏️</button>
              <button (click)="borrar(item.id)">🗑️</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
