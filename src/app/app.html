<div style="padding: 20px; max-width: 500px;">
  <h2>Admin Panel - Añadir Experiencia</h2>
  
  <input [(ngModel)]="newWork.company" placeholder="Empresa" style="display:block; margin:10px 0; width:100%">
  <input [(ngModel)]="newWork.position" placeholder="Puesto" style="display:block; margin:10px 0; width:100%">
  <input [(ngModel)]="newWork.startDate" placeholder="Fecha Inicio" style="display:block; margin:10px 0; width:100%">
  <input [(ngModel)]="newWork.endDate" placeholder="Fecha Fin" style="display:block; margin:10px 0; width:100%">
  <textarea [(ngModel)]="newWork.accomplishments" placeholder="Logros" style="display:block; margin:10px 0; width:100%"></textarea>
  
  <button (click)="guardarTrabajo()" style="background: #c94c4c; color: white; padding: 10px; border: none; cursor: pointer;">
    Guardar en Firebase
  </button>
</div>
